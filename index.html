<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/logodi.png">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard | TKA SMA Daarul Ilmi</title>
</head>

<body>

  <div class="app">
    <!-- LEFT -->
    <section class="left">
      <header class="brand">
        <img src="img/logodi.png" alt="Logo Sekolah" class="logo">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6" />
            <stop offset="1" stop-color="#1d4ed8" />
          </linearGradient>
        </defs>
        <path d="M50 4 90 18v30c0 25-17 41-40 48C27 89 10 73 10 48V18z" fill="url(#lg)" />
        <path d="M50 30 24 42l26 12 26-12z" fill="#fff" />
        <path d="M34 50v12c0 4 7 8 16 8s16-4 16-8V50L50 58z" fill="#bfdbfe" />
        </svg>
        <div class="brand-text">
          <small>Ujian TKA</small>
          <strong>SMA Daarul Ilmi Cipeundeuy</strong>
        </div>
      </header>

      <div class="panel">
        <div class="label">Token Ujian</div>
        <div class="token idle" id="token">-----</div>
        <div class="divider"></div>
        <div class="label">Sisa Waktu</div>
        <div class="timer" id="timer">15:00</div>
        <div class="state-pill" id="statePill" data-state="idle"><span class="dot"></span><span class="lbl">Siap</span>
        </div>
      </div>

      <!-- ADMIN CONTROL BAR (dihapus otomatis pada mode TV) -->
      <div class="admin-bar" id="adminBar">
        <div class="btn-row">
          <button class="btn btn-primary" id="btnToken" type="button" title="Pintasan: Spasi / Enter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="8" cy="15" r="4" />
              <path d="M10.8 12.2 20 3m-4 4 3 3m-6-1 2 2" />
            </svg>
            <span>Set Token</span>
          </button>
          <button class="btn btn-secondary" id="btnToggle" type="button">
            <span class="ico"></span><span class="txt">Mulai Timer</span>
          </button>
          <button class="btn btn-ghost" id="btnReset" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span class="txt">Reset Timer</span>
          </button>
        </div>
        <div class="meta">
          <span class="role">ADMIN</span>
          <span class="sync" data-state="connecting"><span class="dot"></span><span
              class="lbl">Menghubungkan…</span></span>
          <a class="tv-link" id="tvLink" href="?mode=tv" target="_blank" rel="noopener">Buka Tampilan TV ↗</a>
        </div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="grid" id="grid" aria-label="Denah meja siswa"></section>
  </div>

  <!-- Indikator koneksi kecil khusus mode TV -->
  <span class="sync sync-tv" data-state="connecting"><span class="dot"></span><span
      class="lbl">Menghubungkan…</span></span>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-label">
      <label for="tokenInput" id="modal-label">Masukkan Token Baru</label>
      <input type="text" id="tokenInput" maxlength="12" placeholder="-----" autocomplete="off" autocorrect="off"
        autocapitalize="characters" spellcheck="false">
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btnCancel" type="button">Batal</button>
        <button class="btn btn-primary" id="btnSave" type="button">Simpan &amp; Mulai</button>
      </div>
      <div class="hint"><kbd>Enter</kbd> simpan &nbsp;·&nbsp; <kbd>Esc</kbd> batal</div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</body>

</html>
